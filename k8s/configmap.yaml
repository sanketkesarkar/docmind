apiVersion: v1
kind: ConfigMap
metadata:
  name: docmind-config
  namespace: docmind
data:
  REDIS_URL: redis://redis:6379
  AUTO_INIT_DB: "false"          # the migrate Job does this once
  STORAGE_BACKEND: s3
  S3_ENDPOINT_URL: http://seaweedfs:8333
  S3_BUCKET: docmind

# Calibrate on labeled questions; cosine similarity is not a probability.
  MIN_COSINE_SIMILARITY: "0.5"
