apiVersion: apps/v1
kind: Deployment
metadata:
  name: docmind-worker
  namespace: docmind
spec:
  replicas: 1          # KEDA takes over scaling (see keda-scaledobject.yaml)
  selector:
    matchLabels:
      app: docmind-worker
  template:
    metadata:
      labels:
        app: docmind-worker
    spec:
      terminationGracePeriodSeconds: 1860   # let RQ finish the current job on SIGTERM
      containers:
        - name: worker
          image: docmind-backend:0.2.1
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.workers.ingestion"]
          envFrom:
            - configMapRef: {name: docmind-config}
            - secretRef: {name: docmind-secrets}
          livenessProbe:
            exec:
              command: ["python", "-m", "app.workers.healthcheck"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3
          resources:
            requests: {cpu: 250m, memory: 384Mi}
            limits: {memory: 1Gi}
