apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: docmind
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: docmind
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:0.8.0-pg16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: docmind
            - name: POSTGRES_DB
              value: docmind
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: docmind-secrets, key: POSTGRES_PASSWORD}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "docmind", "-d", "docmind"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "docmind", "-d", "docmind"]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
