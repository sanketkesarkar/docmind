# S3-compatible object store for uploaded PDFs (SeaweedFS single node).
# Credentials are required via the seaweedfs-s3 secret.
# In production, point S3_ENDPOINT_URL at AWS S3 (or another managed store) and delete this file.
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
  namespace: docmind
spec:
  selector:
    app: seaweedfs
  ports:
    - name: s3
      port: 8333
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs
  namespace: docmind
spec:
  serviceName: seaweedfs
  replicas: 1
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:3.85
          args: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-master.volumeSizeLimitMB=256"]
          ports:
            - containerPort: 8333
          readinessProbe:
            tcpSocket: {port: 8333}
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: 8333}
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - name: s3-config
              mountPath: /etc/seaweedfs
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: s3-config
          secret:
            secretName: seaweedfs-s3
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
